[workspace]
edition = "2024"
resolver = "2"
members = [
    "test-app",
    "voxel-engine",
    "mip-texture-array",
    "bevy_renderdoc",
    "octo",
    "async-bevy-events"
]

[workspace.dependencies]
# Workspace crates
async-bevy-events.path = "./async-bevy-events"
bevy_renderdoc.path = "./bevy_renderdoc"
octo.path = "./octo"
voxel-engine.path = "./voxel-engine"
mip-texture-array.path = "./mip-texture-array"

# Regular dependencies
bevy = "0.16.0"
flume = "0.11.1"
thiserror = "2.0.12"
dashmap = "6.1.0"
static_assertions = "1.1.0"
parking_lot = "0.12.3"
enumset = "1.1.6"

[workspace.dependencies.derive_more]
version = "2.0.1"
features = ["full"]

##########################################################
# Release Profile
##########################################################
[profile.release]
opt-level = 2
debug = "full"
strip = "none"

##########################################################
# Dev/Debug Profile
##########################################################
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

##########################################################
# Test Profile
##########################################################
[profile.test]
opt-level = 0
debug = "full"
strip = "none"

[profile.test.package."*"]
opt-level = 0
debug = "full"
strip = "none"