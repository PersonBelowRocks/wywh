[package]
name = "octo"
version = "0.3.2"
edition = "2024"

[profile.bench]
opt-level = 3
debug = "full"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false

[dependencies]
static_assertions.workspace = true
thiserror.workspace = true
ahash = "0.8.11"
derive-new = "0.7.0"
glam = { version = "0.30.3", features = ["serde"] }
hashbrown = "0.15.3"
ndarray = "0.16.1"
smallvec = "1.15.0"
rustc-hash = "2.1.1"
itertools = "0.14.0"
slab = "0.4.9"
serde = { version = "1.0.219", features = ["derive"] }
num = "0.4.3"
rangemap = { version = "1.5.1", features = ["serde"] }
bitvec = "1.0.1"

[dev-dependencies]
criterion = "0.5.1"
rand = "0.9.1"

[[bench]]
name = "octree"
harness = false

[[bench]]
name = "subdiv_bench"
harness = false
